name: Deploy assistant (PWA)

# Builds apps/assistant and publishes it to GitHub Pages so it can be
# installed on an iPhone via Safari "Add to Home Screen".

on:
  push:
    branches: [main]
    paths:
      - 'apps/assistant/**'
      - '.github/workflows/deploy-assistant.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/assistant/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Set this in repo Settings → Secrets and variables → Actions →
          # Variables. Leave unset to ship with cloud sync disabled.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/assistant/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
